spring:
  application:
    name: movie-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/movie_service}
    username: ${DB_USERNAME:cinebase}
    password: ${DB_PASSWORD:cinebase}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  grpc:
    client:
      channel:
        person:
          target: ${GRPC_HOST:localhost}:${GRPC_PORT:9090}
          default:
            deadline: ${GRPC_DEADLINE:5s}

server:
  port: 8081

# The GraphQL SDL already declares `scalar Upload`, so the library must not add its own copy.
multipart:
  springboot:
    patch-schema:
      enabled: false

app:
  uploads-dir: ${UPLOADS_DIR:uploads}
